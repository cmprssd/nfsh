[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.20.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/cmprssd/nfsh"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies are hot paths even in tests that read the retail data; optimize them in
# dev builds too.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
